# Three jobs, sized for a 2-core, 4 GB machine (GitHub's standard runner is no smaller).
#
#  check        every push and pull request. The same `bun run check` as the pre-commit hook.
#  browser      every push to main, every pull request and by hand: the interface's tests in headless Chromium
#               (`bun run test:browser`). About 23 s of tests and 2.2 GB at its peak, which is why it is not in the gate.
#  integration  every push to main, every pull request and by hand: all seven suites. Starts real
#               processes (Claude, a daemon, Electron under xvfb, the page in headless Chromium): serial, a deadline per suite, about 1.5 GB at
#               its peak. It needs no secrets: the model is a mock, and nothing here may read an API key from the
#               environment. --strict: a suite that skipped itself because the runner lacks Electron, xvfb or sshd
#               is a failure here, not an "ok".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: browser-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      # The libraries Chromium needs (the browser itself is cached, and installed by test:browser when it is not).
      - run: bunx playwright install-deps chromium-headless-shell
        working-directory: packages/ui
      - run: bun run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: packages/ui/.vitest/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/ms-playwright
          key: integration-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: integration-${{ runner.os }}-
      - uses: ./.github/actions/codex-sandbox
      - name: Libraries Electron needs, and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libxss1
      - run: bun install --frozen-lockfile --ignore-scripts
      # bun does not run Electron's postinstall, which is what downloads the binary.
      - run: bun node_modules/.bun/electron@*/node_modules/electron/install.js
      # The web suite's browser, and the libraries it needs.
      - run: bunx playwright install --with-deps chromium-headless-shell
        working-directory: apps/desktop
      - run: bun run test:integration --strict --summary "$GITHUB_STEP_SUMMARY"
