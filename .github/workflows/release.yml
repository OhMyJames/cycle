# Publishes the signed and notarized macOS app when a `v<version>` tag is pushed. The packaged app
# updates itself from these releases: apps/desktop/src/update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    # Apple silicon. The app is signed with the Developer ID and notarized below, so a copy
    # downloaded with a browser passes Gatekeeper; `desktop:package` alone leaves it ad hoc.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # the root package.json's packageManager

      - run: bun install --frozen-lockfile

      - name: The tag is the app's version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version apps/desktop/package.json)"

      - run: bun run check

      - run: bun run desktop:package

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/cycle-signing.keychain-db"
          PASSWORD=$(openssl rand -hex 16)
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cycle.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cycle.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/cycle.p12"
          echo "CYCLE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign and notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          printf '%s' "$APPLE_API_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          bun run desktop:release-sign
          rm "$APPLE_API_KEY_PATH"

      - name: The app passes Gatekeeper
        run: /usr/sbin/spctl --assess --type execute --verbose=4 "apps/desktop/build/Cycle Codex.app"

      - name: Archive and manifest
        run: bun run desktop:release-assets

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "$CYCLE_KEYCHAIN" ]; then security delete-keychain "$CYCLE_KEYCHAIN" || true; fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/desktop/build/release/* --generate-notes
